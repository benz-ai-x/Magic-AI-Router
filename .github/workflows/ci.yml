name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Lock drift check
        run: |
          python -m pip install uv
          uv pip compile requirements-dev.txt --python-version 3.12 --generate-hashes -o /tmp/lock-regen.txt
          diff <(grep -E '^[a-zA-Z0-9._-]+==' /tmp/lock-regen.txt | sort) \
               <(grep -E '^[a-zA-Z0-9._-]+==' requirements-lock.txt | sort) \
            || (echo "requirements-lock.txt 已漂移——请重生成并提交" && exit 1)
      - name: Python tests + coverage gate
        run: python -m pytest -q tests/ --cov --cov-fail-under=90
      - name: Node tests (config_ui.html LAYER 1/2)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/js/*.test.mjs
      - name: Ruff
        run: ruff check .
      - name: Compile + shell syntax
        run: |
          python -m py_compile app.py util.py capture/mitmdump_entry.py tunnel/proxy.py services/config_server.py services/suanpan_runtime.py capture/capture.py capture/ai_capture_addon.py sysctl/system_proxy.py shellui/webview_window.py suanpan/main.py suanpan/router.py
          bash -n build.sh scripts/build_dmg.sh scripts/notarize.sh

  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Build app and DMG
        run: |
          MAIN_PYTHON_BIN=python MITM_PYTHON_BIN=python bash build.sh
          test -x "dist/Magic AI Router.app/Contents/Resources/mitmdump/mitmdump"
          "dist/Magic AI Router.app/Contents/Resources/mitmdump/mitmdump" --version
          VERSION=$(grep -E '^VERSION=' build.sh | head -1 | sed -E 's/VERSION="([^"]*)"/\1/')
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/Magic AI Router.app/Contents/Info.plist')" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' 'dist/Magic AI Router.app/Contents/Info.plist')" = "true"
          codesign --verify --strict --deep "dist/Magic AI Router.app"
          MAGIC_PROXY_SMOKE_TEST=1 "dist/Magic AI Router.app/Contents/MacOS/Magic AI Router"
          bash scripts/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mage-ai-router-unsigned-arm64
          path: |
            dist/Magic AI Router.app
            dist/Magic AI Router-*.dmg
