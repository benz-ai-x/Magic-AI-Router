<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic AI Router · 设置</title>
<style>
:root{--bg:#fff;--surface:#f7f8fa;--fg:#111;--muted:#6b7280;--border:#d9dee7;--accent:#0f66e0;
--ok:#2c7c4d;--danger:#d62516;--warn:#966305;--font-display:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
--font-mono:"SFMono-Regular",Consolas,Menlo,monospace;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--surface:#2c2c2e;--fg:#f5f5f7;--muted:#aeaeb2;--border:#3a3a3c;--accent:#4098ff;--ok:#30d158;--danger:#ff5c50;--warn:#ffd60a;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{overflow:hidden;background:var(--surface);color:var(--fg);
font-family:var(--font-display);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;outline:none}
.mono{font-family:var(--font-mono)}
button:focus-visible,input:focus-visible{outline:3px solid color-mix(in oklch,var(--accent),var(--bg) 30%);outline-offset:2px}
.app-shell{width:100%;height:100%;min-width:880px;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:minmax(0,1fr);border:1px solid var(--border);background:var(--bg)}
/* sidebar */
.sidebar{display:flex;flex-direction:column;padding:20px 14px 14px;background:var(--surface);border-right:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;border-bottom:1px solid var(--border)}
.brand-mark{width:30px;height:24px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:5px 4px;border:1px solid var(--fg);border-radius:4px}
.brand-mark i{width:5px;height:5px;justify-self:center;border-radius:50%;background:var(--fg)}
.brand-name{font-size:16px;font-weight:600;line-height:1.35;white-space:nowrap}
.brand-subtitle{color:var(--muted);font-size:12px}
.nav-group{margin-top:16px}
.nav-group:first-of-type{margin-top:14px}
.nav-label{padding:0 10px 6px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.side-nav{display:grid;gap:3px}
.nav-item{width:100%;min-height:40px;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-weight:550;font-size:15px}
.nav-item svg{width:17px;height:17px;flex:0 0 auto;align-self:flex-start;margin-top:2px}
.nav-text{display:flex;flex-direction:column;min-width:0}
.nav-sub{display:block;font-size:11px;color:var(--muted);font-weight:400;line-height:1.4}
.nav-item:hover{background:color-mix(in oklch,var(--surface),var(--border) 28%);color:var(--fg)}
.nav-item[aria-current=page]{background:var(--bg);color:var(--fg);border-color:var(--border);box-shadow:0 1px 2px color-mix(in oklch,var(--fg),transparent 94%)}
.sidebar-spacer{flex:1}
.priority-note{margin:16px 4px 0;padding:12px 10px;border-top:1px solid var(--border);color:var(--muted);font-size:13px;line-height:1.6}
.priority-note strong{display:block;margin-bottom:4px;color:var(--fg);font-weight:550}
.sidebar-ai-helper{margin:8px 4px 0}
.sidebar-ai-helper .btn svg{width:16px;height:16px;flex:0 0 auto}
/* workbench */
.workbench{display:grid;grid-template-areas:"header" "pending" "content" "status";grid-template-rows:72px auto minmax(0,1fr) 32px;background:var(--bg);min-width:0;min-height:0}
.app-header{grid-area:header;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 28px;border-bottom:1px solid var(--border)}
.page-heading h1{font-size:23px;font-weight:600;line-height:1.35}
.page-heading p{color:var(--muted);font-size:13px}
.header-actions{display:flex;gap:8px;align-items:center}
.pending-bar{grid-area:pending;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:9px 28px;border-bottom:1px solid color-mix(in oklch,var(--accent),var(--border) 52%);background:color-mix(in oklch,var(--accent),var(--bg) 94%)}
.pending-copy{display:flex;align-items:center;gap:12px;min-width:0}
.pending-copy strong{font-size:13px;white-space:nowrap}
.pending-items{display:flex;align-items:center;gap:6px;min-width:0;overflow-x:auto;padding:2px}
.pending-item{min-height:30px;padding:0 9px;border:1px solid color-mix(in oklch,var(--accent),var(--border) 65%);border-radius:999px;background:var(--bg);color:var(--fg);cursor:pointer;font-size:12px;white-space:nowrap}
.pending-item:hover{border-color:var(--accent);color:var(--accent)}
.pending-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
/* buttons */
.btn{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer;font-size:14px;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface);border-color:color-mix(in oklch,var(--border),var(--fg) 16%)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{border-color:var(--accent);background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.88}
.btn-primary.dirty{box-shadow:0 0 0 3px color-mix(in oklch,var(--accent),transparent 75%)}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px}
.btn-icon{width:32px;min-width:32px;min-height:32px;height:32px;padding:0;display:grid;place-items:center}
.btn-icon svg{width:16px;height:16px}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:color-mix(in oklch,var(--danger),transparent 92%)}
.btn-confirm{background:var(--danger)!important;border-color:var(--danger)!important;color:#fff!important}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:transparent;border-color:var(--border);color:var(--fg)}
/* content */
.content-viewport{grid-area:content;overflow:auto;background:var(--surface)}
.view{display:none;min-height:100%;padding:20px 24px 32px}
.view.is-active{display:block}
.module-intro{max-width:760px;margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.7}
.panel{border:1px solid var(--border);border-radius:8px;background:var(--bg);overflow:hidden;margin-bottom:16px}
.panel:last-child{margin-bottom:0}
/* 宽窗口收束（#3 P2）：普通流式视图的面板/导语限宽居中，表单与统计卡片不再
   过度拉伸；master-detail 的面板（含 .md-layout）保持全宽 */
.view .panel:not(:has(.md-layout)){max-width:1100px;margin-left:auto;margin-right:auto}
.view>.module-intro{margin-left:auto;margin-right:auto}
/* empty state */
.empty-state{padding:48px 24px;text-align:center;color:var(--muted)}
.empty-state p{margin-bottom:16px;font-size:15px}
.empty-state-inline{padding:32px 24px;text-align:center;color:var(--muted)}
.empty-state-inline p{margin-bottom:12px;font-size:15px}
/* section bar */
.section-bar{min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border)}
.section-title{font-size:15px;font-weight:600}
.count{color:var(--muted);font-size:13px}
.section-actions{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px}
.chip-x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.chip-x:hover{color:var(--danger)}
.models-actions{display:flex;gap:8px;align-items:center}
.models-error{color:var(--danger);font-size:13px;margin-top:8px;min-height:14px}
/* master-detail */
.md-layout{display:grid;grid-template-columns:240px minmax(0,1fr)}
.content-viewport:has(.md-layout){overflow:hidden}
.content-viewport:has(.md-layout) .view.is-active{display:flex;flex-direction:column;min-height:0}
.content-viewport:has(.md-layout) .panel:has(.md-layout){min-height:0;display:flex;max-height:calc(100vh - 220px)}
.md-layout{flex:1;min-height:0}
.md-master{display:flex;flex-direction:column;border-right:1px solid var(--border);min-height:0}
.md-list{padding:8px;flex:1;overflow-y:auto}
.md-row{width:100%;min-height:52px;display:grid;grid-template-columns:8px minmax(0,1fr);align-items:center;gap:10px;padding:8px 10px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;text-align:left}
.md-row:hover{background:var(--surface)}
.md-row.is-selected{border-color:var(--border);background:var(--surface)}
/* dot 语义：彩色=启用/当前，灰色=停用/非当前（master 列表行与图例共用） */
.md-master .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.md-master .dot.off{background:var(--muted)}
.md-legend{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;white-space:nowrap}
.md-legend .dot{margin-left:6px}
.md-legend .dot:first-child{margin-left:0}
.md-row strong{display:block;font-family:var(--font-mono);font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-row .sub{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-master-footer{padding:10px;border-top:1px solid var(--border)}
.md-master-footer .btn{width:100%}
.md-detail{display:flex;flex-direction:column;min-width:0;min-height:0}
.detail-bar{min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border)}
.detail-bar h2{font-family:var(--font-mono);font-size:16px;font-weight:600}
.detail-body{padding:20px;overflow-y:auto}
/* 内层滚动渐隐提示（纯 CSS，background-attachment 双层技巧）：随内容滚动的
   local --bg 色带盖住固定（scroll）的边缘阴影，滚离哪端就露出哪端——
   顶部阴影=上方还有内容，底部阴影=下方还有内容；内容不满时两端都不显示。 */
.md-list,.detail-body{
  background:
    linear-gradient(var(--bg) 45%,transparent) center top/100% 22px no-repeat,
    linear-gradient(transparent,var(--bg) 55%) center bottom/100% 22px no-repeat,
    linear-gradient(color-mix(in oklch,var(--fg),transparent 88%),transparent) center top/100% 8px no-repeat,
    linear-gradient(transparent,color-mix(in oklch,var(--fg),transparent 88%)) center bottom/100% 8px no-repeat;
  background-attachment:local,local,scroll,scroll;
}
/* form sections */
.form-section{padding:16px 0}
.form-section:first-child{padding-top:0}
.form-section+.form-section{border-top:1px solid var(--border)}
.form-section h3{font-size:14px;font-weight:600;margin-bottom:12px}
/* fields */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:block;margin-bottom:5px;color:var(--muted);font-size:13px;font-weight:550}
.control,.select-control{width:100%;min-height:38px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14px}
.control:focus,.select-control:focus{border-color:var(--accent)}
.control.mono,.select-control.mono{font-family:var(--font-mono)}
.control.invalid,.select-control.invalid{border-color:var(--danger);background:color-mix(in oklch,var(--danger),var(--bg) 94%)}
.field-error{margin-top:4px;color:var(--danger);font-size:12px;line-height:1.4}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-grid .span-2{grid-column:1/-1}
.field-hint{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5}
/* segmented control + template row (#3) */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg-btn{min-height:34px;padding:0 16px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:550}
.seg-btn+.seg-btn{border-left:1px solid var(--border)}
.seg-btn[aria-pressed=true]{background:var(--accent);color:#fff}
.tpl-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
/* key field */
.key-field{position:relative}
.key-field .control{padding-right:40px}
.key-toggle{position:absolute;top:0;right:0;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}
.key-toggle:hover{background:var(--surface);color:var(--fg)}
.key-toggle svg{width:16px;height:16px}
/* switch */
.switch-line{display:flex;align-items:center;gap:10px}
.switch{width:44px;height:28px;position:relative;flex:0 0 auto;padding:0;border:0;border-radius:8px;background:transparent;cursor:pointer}
.switch::before{content:"";width:44px;height:28px;position:absolute;top:0;left:0;border:1px solid var(--border);border-radius:999px;background:var(--surface);transition:.18s}
.switch::after{content:"";width:18px;height:18px;position:absolute;top:5px;left:5px;border-radius:50%;background:var(--muted);transition:.18s}
.switch[aria-checked=true]::before{border-color:var(--ok);background:var(--ok)}
.switch[aria-checked=true]::after{transform:translateX(16px);background:var(--bg)}
.switch-label{color:var(--muted);font-size:13px}
/* toggle row */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border:0}
.toggle-row label{color:var(--fg);font-size:14px}
/* settings grid */
.settings-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 20px}
.settings-row .field{margin:0}
.settings-full{padding:0 20px 16px}
.panel-hint{color:var(--muted);font-size:13px;margin:8px 0 0}
/* routing */
.route-slot{padding:16px 20px;border-bottom:1px solid var(--border)}
.route-slot:last-child{border:0}
.route-slot .field{margin-bottom:0}
/* rules */
.rules-table{width:100%;border-collapse:collapse}
.rules-table th{height:40px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:550;letter-spacing:.04em;text-align:left}
.rules-table td{padding:8px 12px;border-bottom:1px solid var(--border)}
.rules-table tbody tr:last-child td{border:0}
.rule-num{color:var(--muted);font-family:var(--font-mono);font-size:13px}
/* port forwards (tunnel detail) */
.fw-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.fw-head h3{margin:0}
.fw-hint{color:var(--muted);font-size:12px;margin:0 0 10px}
.fw-table input.control{width:100%;min-width:0}
.fw-table td{vertical-align:middle}
.fw-actions{display:flex;align-items:center;gap:6px;white-space:nowrap}
.fw-status{font-size:12px;color:var(--muted)}
.nfs-errmsg{color:var(--danger);font-size:11px;margin:4px 0 0;max-width:280px;word-break:break-all}
.fw-status.ok{color:var(--ok)}
.fw-status.err{color:var(--danger)}
.fw-empty td{padding:16px 12px;color:var(--muted);font-size:13px;text-align:center}
/* multi-active tunnel badges */
.fw-badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:11px;line-height:1.5;background:color-mix(in oklch,var(--accent),transparent 88%);color:var(--accent)}
/* statusbar */
.statusbar{grid-area:status;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
.statusbar #status-left.dirty{color:var(--accent);font-weight:550}
/* toast */
.toast{min-width:200px;max-width:400px;position:fixed;right:24px;bottom:24px;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--fg);border-radius:8px;background:var(--fg);color:var(--bg);font-size:14px;opacity:0;pointer-events:none;transform:translateY(8px);transition:.18s}
.toast.is-visible{opacity:1;transform:translateY(0)}
.toast.err{border-color:var(--danger);background:var(--danger)}
/* CC 同步确认弹窗（#3 验收 9）：挂在 body 上，不被 #viewport 重渲染清除 */
.cc-modal-overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:color-mix(in oklch,var(--bg),transparent 35%);backdrop-filter:blur(2px)}
.cc-modal{width:min(680px,calc(100vw - 48px));max-height:calc(100vh - 96px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgb(0 0 0/25%);padding:20px}
.cc-modal h3{font-size:16px;margin:0 0 10px}
.cc-modal-target{font-size:13px;margin:0 0 10px;color:var(--muted)}
.cc-modal-target code{color:var(--fg)}
.cc-modal-sec{font-size:13px;font-weight:600;margin:0 0 6px}
.cc-diff-scroll{overflow:auto;min-height:0;border:1px solid var(--border);border-radius:6px}
.cc-diff-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.cc-diff-table th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--border)}
.cc-diff-table td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.cc-diff-table tr:last-child td{border-bottom:none}
.cc-diff-table td.mono{font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.cc-diff-table th:nth-child(1),.cc-diff-table td:nth-child(1){width:38%}
.cc-diff-table th:nth-child(2),.cc-diff-table td:nth-child(2){width:52px;text-align:center}
.cc-diff-table th:nth-child(3),.cc-diff-table td:nth-child(3),
.cc-diff-table th:nth-child(4),.cc-diff-table td:nth-child(4){width:27%}
.cc-badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;white-space:nowrap}
.cc-badge-新增{background:color-mix(in oklch,var(--ok),transparent 82%);color:var(--ok)}
.cc-badge-修改{background:color-mix(in oklch,var(--accent),transparent 82%);color:var(--accent)}
.cc-badge-移除{background:color-mix(in oklch,var(--danger),transparent 82%);color:var(--danger)}
/* ── 快速接入向导（ADR-010 M5）── */
.qs-vendors{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qs-vendor{min-height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);cursor:pointer;font-size:13px;font-weight:550}
.qs-vendor:hover{border-color:color-mix(in oklch,var(--fg),var(--border) 60%)}
.qs-vendor.is-active{border-color:var(--accent);color:var(--accent);background:color-mix(in oklch,var(--accent),transparent 86%)}
.qs-actions{display:flex;gap:8px;align-items:center;margin-top:14px}
.qs-agents td{vertical-align:middle}
.qs-agent-main{font-weight:550;font-size:14px}
.qs-agent-sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.qs-state-ok{color:var(--ok);font-size:13px}
.qs-state-muted{color:var(--muted);font-size:13px}
.qs-state-default{font-size:13px}
.qs-state-err{color:var(--danger);font-size:13px}
.qs-agents tr.qs-disabled td{opacity:.55}
.qs-agents tbody tr:not(.qs-disabled){cursor:pointer}
.qs-agents tbody tr:not(.qs-disabled):hover td{background:var(--surface)}
/* 宽窗口防护：快速接入是表单页，不加宽度上限时 field-grid 两列会被
   拉到 700px+（2000px 窗口实测），比例失衡——面板限宽居中，导语
   与面板同宽对齐（而非全站 760px） */
.qs-narrow .panel.panel{max-width:960px;margin-left:auto;margin-right:auto}
.qs-narrow>.module-intro{max-width:960px}
.cc-modal-backup{font-size:12px;margin:10px 0 0;color:var(--muted)}
.cc-modal-hint{font-size:12px;margin:4px 0 0;color:var(--muted)}
.cc-modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
/* balance + usage statistics */
.stat-card{padding:16px 20px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.s-primary{font-size:19px;font-weight:600;font-family:var(--font-mono)}
.s-secondary{color:var(--muted);font-size:13px;margin-top:2px}
.pct-ok{color:var(--ok)!important}.pct-warn{color:var(--warn)!important}.pct-danger{color:var(--danger)!important}
.s-label{color:var(--muted);font-size:12px;margin-top:8px;margin-bottom:2px}
/* 余额速览：卡片式列表（方案 A——等高卡片 + 内嵌进度条 + 右对齐余额） */
.bal-list{display:flex;flex-direction:column;gap:8px}

.bal-money-label{font-size:12px;color:var(--muted);margin:0}
.bal-money-value{font-size:18px;font-weight:600;font-family:var(--font-mono);line-height:1.2}
.bal-money-sub{font-size:12px;color:var(--muted)}

<script data-layer="model">
'use strict';
// ════════════════════════════════════════════════════════════════
// LAYER 1 — data & pure logic (no DOM access; mirrored by node tests
// in tests/js/, extracted via the <script data-layer> boundaries).
// ════════════════════════════════════════════════════════════════
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function normalizeState(raw){
  // Shape whatever the server returned into the canonical in-memory model.
  const S=raw||{};
  S.mp=S.mp||{};S.sp=S.sp||{};
  S.mp.tunnels=S.mp.tunnels||[];
  S.sp.providers=S.sp.providers||{};
  S.sp.router=S.sp.router||{};
  S.sp.rules=S.sp.rules||[];
  return S;
}
function cloneData(value){
  return value==null?value:JSON.parse(JSON.stringify(value));
}
function countChanges(before,after){
  // Count changed leaves, with an added/removed object or array item treated
  // as one user-visible change.  This powers both the dirty boolean and the
  // per-page change counts shown in the pending bar.
  if(Object.is(before,after))return 0;
  if(before==null||after==null)return 1;
  const beforeArray=Array.isArray(before),afterArray=Array.isArray(after);
  if(beforeArray||afterArray){
    if(!beforeArray||!afterArray)return 1;
    let total=Math.abs(before.length-after.length);
    for(let i=0;i<Math.min(before.length,after.length);i++)total+=countChanges(before[i],after[i]);
    return total;
  }
  if(typeof before==='object'&&typeof after==='object'){
    let total=0;
    const keys=new Set([...Object.keys(before),...Object.keys(after)]);
    keys.forEach(key=>{
      if(!Object.prototype.hasOwnProperty.call(before,key)||!Object.prototype.hasOwnProperty.call(after,key))total++;
      else total+=countChanges(before[key],after[key]);
    });
    return total;
  }
  return 1;
}
function numberDefault(value,fallback){
  if(value==null||value==='')return fallback;
  const n=Number(value);return Number.isFinite(n)?n:fallback;
}
// #53 声明：__saved_api_key__ / __saved_password__ 是脏检查投影层的
// 占位哨兵（viewSnapshot/dirtyProjection 专用）——collect() 从表单读到
// 空值即回写 null，哨兵永不上 PUT 线、永不入 S.sp/S.mp 持久态。
// NFS 视图投影（ADR-007）：collect 的缺省口径与本投影同一语义——空端口
// =12049、空字段=''、auto_mount 严格布尔，未触碰的隧道不产生假 dirty。
// nfs_states 装饰值归一（对象 {status,error,fixable}；字符串 = 旧形状
// 兼容测试夹具）——可见性链路：分类(fixable)→投影→装饰→此处→状态单元格
function nfsStateOf(states,name){
  const v=(states||{})[name];
  if(v==null)return{status:'unmounted',error:'',fixable:''};
  if(typeof v==='string')return{status:v,error:'',fixable:''};
  return{status:v.status||'unmounted',error:v.error||'',fixable:v.fixable||''};
}
// 运行态装饰定向合并：只动装饰字段，绝不覆盖表单字段（dirty 真相在
// 表单）——曾有的坑：整页 renderView 会冲掉未保存的编辑
function mergeRuntimeDecorations(S,fetched){
  const fm=(fetched&&fetched.mp)||{};
  const byId={};
  (fm.tunnels||[]).forEach(t=>{if(t&&t.id)byId[t.id]=t;});
  (S.mp.tunnels||[]).forEach(t=>{
    if(!t||!t.id)return;
    const f=byId[t.id];if(!f)return;
    t.nfs_states=f.nfs_states||{};
    t.is_proxy=f.is_proxy===true;
    t.forward_running=f.forward_running===true;
    t.has_password=f.has_password===true;
  });
  if('capture_active' in fm)S.mp.capture_active=fm.capture_active===true;
  return S;
}

function nfsProjection(n){
  n=n||{};
  return{
    enabled:n.enabled===true,
    local_port:numberDefault(n.local_port,12049),
    squash_to_ssh_user:n.squash_to_ssh_user===true,
    mounts:(n.mounts||[]).map(m=>({
      name:(m&&m.name)||'',
      remote_path:(m&&m.remote_path)||'',
      local_dir:(m&&m.local_dir)||'',
      auto_mount:!!m&&m.auto_mount===true,
    })),
  };
}
function viewSnapshot(view,state,roles){
  // Project the shared config into the values owned by one settings page.
  // Defaults match what the form renders, preventing an untouched omitted
  // value from becoming a false change merely because collect() filled it in.
  const mp=(state&&state.mp)||{},sp=(state&&state.sp)||{};
  if(view==='tunnel')return{
    // 角色真相是 current_tunnel_id（稳定 id）；派生下标不入 dirty 面
    //（隧道删除/调序不应伪造角色变更）
    current_tunnel_id:(mp.current_tunnel_id==null?'':String(mp.current_tunnel_id)),
    tunnels:(mp.tunnels||[]).map(t=>({
      id:t.id||'',name:t.name||'',ssh_user:t.ssh_user||'',ssh_host:t.ssh_host||'',
      ssh_port:numberDefault(t.ssh_port,22),auth_type:t.auth_type||'key',
      ssh_key:t.ssh_key||'',ssh_compression:t.ssh_compression!==false,
      password:t.password||(t.has_password?'__saved_password__':''),
      forward_autostart:t.forward_autostart===true,
      // collect 的缺省口径：空端口=0、空地址=127.0.0.1（与服务端 merge
      // 归一同一语义），未触碰行不产生假 dirty。
      // is_proxy/forward_running 是服务端运行态装饰（不入快照——非用户
      // 可编辑面，prepare 的 READONLY_DECORATED_FIELDS 剥除）
      forwards:(t.forwards||[]).map(f=>({
        local_port:numberDefault(f.local_port,0),
        remote_host:f.remote_host||'127.0.0.1',
        remote_port:numberDefault(f.remote_port,0),
      })),
    })),
  };
  if(view==='nfs')return{
    // 运行态装饰 nfs_states 不入 dirty 面（READONLY_DECORATED_FIELDS 剥除）
    tunnels:(mp.tunnels||[]).map(t=>({
      id:t.id||'',
      nfs:nfsProjection(t.nfs),
    })),
  };
  if(view==='proxy')return{
    socks5_port:numberDefault(mp.socks5_port,1080),
    http_listen_port:numberDefault(mp.http_listen_port,8888),
    capture_port:numberDefault(mp.capture_port,8080),
    capture_dir:mp.capture_dir||'~/.magic-proxy-captures',
    retention_days:numberDefault(mp.retention_days,7),
    config_port:numberDefault(mp.config_port,9528),
    listen_port:numberDefault(sp.listen_port,9527),
  };
  if(view==='system')return{
    system_proxy_default:mp.system_proxy_default===true,
    prevent_sleep:mp.prevent_sleep===true,
    launch_at_login:mp.launch_at_login===true,
    config_api_enabled:mp.config_api_enabled===true,
  };
  if(view==='providers'){
    const providers={};
    Object.keys(sp.providers||{}).sort().forEach(name=>{
      const p=sp.providers[name]||{};
      providers[name]={
        id:p.id||'',
        base_url:p.base_url||'',
        api_key:p.api_key||(p.api_key_set?'__saved_api_key__':''),
        api_key_env:p.api_key_env||'',auth_header:p.auth_header||'',
        models:Array.isArray(p.models)?[...p.models]:[],
        anthropic_native:p.anthropic_native===true,enabled:p.enabled!==false,
      };
    });
    return providers;
  }
  if(view==='rules'){
    const roleState={};
    Object.keys(roles||{}).sort().forEach(key=>{
      const role=roles[key]||{};
      roleState[key]={model:role.model||'',name:role.name||'',ctx_1m:role.ctx_1m!==false};
    });
    return{default_model:(sp.router||{}).default||'',rules:cloneData(sp.rules||[]),roles:roleState};
  }
  return null;
}
// #70 S1：路由目标文法镜像 suanpan/router.parse_route_target（"/" 优先
// "," 兜底）——单一所有者；不再散点 split('/')。
function parseTarget(t){
  t=String(t||'');
  const sep=t.includes('/')?'/':(t.includes(',')?',':'/');
  const i=t.indexOf(sep);
  return i<0?[t,'']:[t.slice(0,i),t.slice(i+1)];
}
function validateConfig(S){
  // Pre-save validation; returns a list of human-readable error strings.
  const errors=[];
  if(S&&S.sp&&S.sp._load_error)errors.push('Suanpan 配置装载失败，已阻止保存以防覆盖：'+S.sp._load_error);
  if(S&&S.mp&&S.mp._load_error)errors.push('Magic Proxy 配置装载失败，已阻止保存以防覆盖：'+S.mp._load_error);
  (S.mp.tunnels||[]).forEach((t,i)=>{
    if(!t.ssh_host)errors.push(`隧道 ${i+1}: 未填写地址`);
    if(t.ssh_port&&(t.ssh_port<1||t.ssh_port>65535))errors.push(`隧道 ${i+1}: SSH 端口无效`);
    // 端口转发行：范围 + 同隧道重复 + remote_host 文法（镜像 prepare 的
    // 中文文案——prepare 是 422 兜底，这里是保存前第一道）
    const tn=t.name||t.ssh_host||(`隧道 ${i+1}`);
    const fwSeen={};
    (t.forwards||[]).forEach(f=>{
      // 与 prepare 同口径：端口须整数（拦小数），remote_host 字串化
      // （数字形态仅在直改 state 时出现，String 兜底不抛 TypeError）
      const lp=f.local_port,rp=f.remote_port,rh=String(f.remote_host||'127.0.0.1');
      if(!Number.isInteger(lp)||lp<1||lp>65535)errors.push(`${tn}: 转发本地端口无效（须 1..65535）`);
      else if(fwSeen[lp])errors.push(`${tn}: 转发本地端口 ${lp} 重复`);
      else fwSeen[lp]=1;
      if(!Number.isInteger(rp)||rp<1||rp>65535)errors.push(`${tn}: 转发远程端口无效（须 1..65535）`);
      if(/\s/.test(rh)||rh.includes(':'))errors.push(`${tn}: 转发远程地址无效（暂不支持 IPv6）`);
    });
  });
  if(S.mp.socks5_port&&(S.mp.socks5_port<1||S.mp.socks5_port>65535))errors.push('SOCKS5 端口无效');
  if(S.mp.http_listen_port&&(S.mp.http_listen_port<1||S.mp.http_listen_port>65535))errors.push('HTTP 监听端口无效');
  if(S.mp.capture_port&&(S.mp.capture_port<1||S.mp.capture_port>65535))errors.push('抓包端口无效');
  if(S.mp.config_port&&(S.mp.config_port<1||S.mp.config_port>65535))errors.push('配置服务端口无效');
  if(S.sp.listen_port&&(S.sp.listen_port<1||S.sp.listen_port>65535))errors.push('路由网关端口无效');
  // Port uniqueness across services — a duplicate only fails at bind time
  // otherwise, long after the user left the form. Absent values are skipped
  // (collect() fills defaults once the view has been visited).
  const portRefs=[['SOCKS5',S.mp.socks5_port],['HTTP 监听',S.mp.http_listen_port],['抓包',S.mp.capture_port],['配置服务',S.mp.config_port],['路由网关',S.sp.listen_port]];
  const seen={};
  portRefs.forEach(([label,p])=>{
    if(p==null||p==='')return;
    if(seen[p])errors.push(`端口冲突：${seen[p]} 与 ${label} 同为 ${p}`);
    else seen[p]=label;
  });
  // 转发本地端口全局唯一（多活 v0.9：任意隧道可并行，抢同端口会让两条
  // ssh 在 ExitOnForwardFailure 下互顶）；镜像 prepare 同一判定
  (S.mp.tunnels||[]).forEach(t=>{
    const tn=t.name||t.ssh_host||'隧道';
    (t.forwards||[]).forEach(f=>{
      const lp=f.local_port;
      const ref=`${tn} 端口转发本地端口`;
      if(lp){
        if(seen[lp])errors.push(`端口冲突：${seen[lp]} 与 ${ref} 同为 ${lp}`);
        else seen[lp]=ref;
      }
    });
  });
  Object.entries(S.sp.providers||{}).forEach(([k,p])=>{
    if(!k||!k.trim())errors.push('供应商名称不能为空');
    // 对齐 suanpan/config.py ProviderConfig._check_auth：环境变量凭证必须显式选择认证头
    if(p&&p.api_key_env&&!p.auth_header)errors.push(`供应商 ${k}：使用环境变量时须选择认证头`);
  });
  // #3 悬空引用：规则/默认路由指向的供应商必须存在，否则网关路由落空。
  const providerNames=new Set(Object.keys(S.sp.providers||{}));
  (S.sp.rules||[]).forEach((r,i)=>{
    const t=(r&&r.route_to)||'',pk=parseTarget(t)[0];
    if(t&&!providerNames.has(pk))errors.push(`规则 ${i+1} 引用了不存在的供应商 ${pk}`);
  });
  const defRoute=(S.sp.router||{}).default||'',defPk=parseTarget(defRoute)[0];
  if(defRoute&&!providerNames.has(defPk))errors.push(`默认路由引用了不存在的供应商 ${defPk}`);
  return errors;
}

function addrStr(t){return t.ssh_host?(t.ssh_user?t.ssh_user+'@':'')+t.ssh_host:'';}
function parseAddr(s){
  // IPv6-safe: supports user@host, user@[::1], user@host:port, user@[::1]:22
  let user='',hostPart=s;
  const at=s.lastIndexOf('@');
  if(at>=0){user=s.substring(0,at);hostPart=s.substring(at+1);}
  let host=hostPart;
  const bm=hostPart.match(/^\[([^\]]+)\](?::(\d+))?$/);
  if(bm)host=bm[1];
  else if(hostPart.split(':').length<=2){const ci=hostPart.lastIndexOf(':');if(ci>=0)host=hostPart.substring(0,ci);}
  return{user,host};
}
function fmtNum(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n);}
function fmtRate(rate){return rate==null?'—':Math.round(rate*100)+'%';}
const USAGE_RANGE_OPTIONS=[
  {value:'today',label:'今日'},
  {value:'7d',label:'近 7 天'},
  {value:'all',label:'全部'},
];
function usageRangeOptions(active){
  const selected=USAGE_RANGE_OPTIONS.some(x=>x.value===active)?active:'all';
  return USAGE_RANGE_OPTIONS.map(x=>({...x,active:x.value===selected}));
}
const ROUTE_SOURCE_LABELS={
  inline:'内联覆盖',
  subagent:'SUBAGENT-MODEL 标签',
  rule:'模型规则',
  default:'默认路由',
};
function routeSourceLabel(source){return ROUTE_SOURCE_LABELS[source]||source;}
const ANTHROPIC_CACHE_ENDPOINTS=[
  {host:'api.anthropic.com',path:'/'},
  {host:'open.bigmodel.cn',path:'/api/anthropic'},
  {host:'api.kimi.com',path:'/coding'},
];
function supportsAnthropicPromptCaching(provider){
  let endpoint;
  try{endpoint=new URL(provider?.base_url||'');}catch(e){return false;}
  const host=endpoint.hostname.toLowerCase();
  const path=endpoint.pathname.replace(/\/+$/,'')||'/';
  return ANTHROPIC_CACHE_ENDPOINTS.some(x=>x.host===host&&(
    x.path==='/'||path===x.path||path.startsWith(x.path+'/')
  ));
}
function providerCacheHint(provider,usage){
  if(!supportsAnthropicPromptCaching(provider)||!usage||!usage.calls||usage.cache_hit_rate!==0||provider.anthropic_native===true)return'';
  return'检查该供应商是否开启 Anthropic 原生模式';
}
// #3 供应商快速模板：只填 base_url 与协议模式，凭证/模型不动。
// #51：模板单一真源在 Python（mpconf.provider_auth.PROVIDER_REGISTRY，

function dailyBarData(daily,metric){

function routeTargetOptionsFor(providers,current,emptyLabel){
  // Shared select options for provider/model targets: empty option first,
  // then per-provider optgroups from each provider's models list. The current
  // value is always present — appended as "（未在清单）" when no option matches,
  // so saving can never silently drop it. Disabled providers are hidden unless
  // the current value references them.
  let currentListed=false;
  const groups=[];
  Object.entries(providers||{}).forEach(([k,p])=>{
    const models=p.models||[];
    if(!models.length)return;
    const referenced=parseTarget(current||'')[0]===k;
    if(p.enabled===false&&!referenced)return;
    const opts=models.map(m=>{
      const v=k+'/'+m;
      if(v===current)currentListed=true;
      return `<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}${ctxSuffix(m)}</option>`;
    }).join('');
    groups.push(`<optgroup label="${esc(k)}${p.enabled===false?'（已停用）':''}">${opts}</optgroup>`);
  });
  const extra=current&&!currentListed?`<option value="${esc(current)}" selected>${esc(current)}（未在清单）</option>`:'';
  return `<option value="">${emptyLabel}</option>${extra}${groups.join('')}`;
}

// ── 保存流（Save Flow）——两阶段保存状态机（架构审查候选 1 深化）─────
// 全库最深的 implementation 从渲染层下沉至此：校验 → PUT 配置 → CC 同步
// 预览（失败关闭）→ 确认弹窗 → setup 写入 → baseline 推进 → 分支 toast。
// 一切副作用经 deps 注入（真 fetch / 测试桩 = 两个真 adapter）；快照是
// collect 之后的纯数据。两次真实事故（99999 端口写库、幽灵 api_key 保存）
// 都发生在这条流上——node 测试从此直接钉住状态机。
const EDITABLE_VIEWS=['tunnel','nfs','proxy','providers','rules','system'];
function dirtyProjection(base,S,baseRoles,roles){
  // 纯派生：哪些页面有真实 diff、各几项。recomputeDirty 与 saveFlow 共用，
  // 保证「按钮上的计数」与「保存流实际处理范围」永远同一口径。
  const views=new Set(),counts=new Map();
  EDITABLE_VIEWS.forEach(view=>{
    const n=countChanges(viewSnapshot(view,base,baseRoles),viewSnapshot(view,S,roles));
    if(n){views.add(view);counts.set(view,n);}
  });

}
function forwardsChanged(base,S){
  // 兼容别名（v0.8 语义消费者）：当前代理隧道的 forwards 是否有变。
  return changedForwardTunnels(base,S).length>0;
}
function changedForwardTunnels(base,S){
  // 多活（v0.9）：返回 forwards 有变的隧道 id 数组——saveFlow 对「正在
  // 运行的」逐隧道触发守卫重连（代理隧道走代理守卫；转发会话按各自
  // 连接态定向守卫），未运行的不拉起。
  const sig=t=>((t&&t.forwards)||[]).map(f=>`${f.local_port}|${f.remote_host}|${f.remote_port}`).join(';');
  const byId=st=>{const m={};((st&&st.mp&&st.mp.tunnels)||[]).forEach(t=>{if(t&&t.id)m[t.id]=t;});return m;};
  const a=byId(base),b=byId(S);
  const out=[];
  for(const id of new Set([...Object.keys(a),...Object.keys(b)])){
    if(sig(a[id])!==sig(b[id]))out.push(id);
  }

}
// 代理角色 → 隧道下标（纯函数，按任意 state 解析）：id 真相 → 悬空/缺省
// 回退旧下标并钳制——与服务端 merge 的解析序同一语义
function proxyIndexOf(st){
  const mp=(st&&st.mp)||{},ts=(mp.tunnels)||[];
  const cid=mp.current_tunnel_id||'';
  if(cid){
    const i=ts.findIndex(t=>t&&t.id===cid);

  }

async function saveFlow(snap,deps,forceRulesSync){
  const{S,ccRoles,baselineState,baselineRoles}=snap;
  const proj=dirtyProjection(baselineState,S,baselineRoles,ccRoles);
  const dirty=proj.views.size>0;
  const rolesChanged=countChanges(baselineRoles,ccRoles)>0;
  const syncRules=forceRulesSync===true||rolesChanged;
  const out={configSaved:false,syncOk:false,cancelled:false};
  if(!dirty&&!syncRules){deps.toast('没有需要保存的更改');return out;}
  if(dirty){
    const errors=validateConfig(S);
    if(errors.length){deps.toast(errors.slice(0,3).join('；')+(errors.length>3?` 等 ${errors.length} 项`:''),true);deps.gotoFirstError(errors[0]);return out;}
  }
  const mpChanged=proj.views.has('tunnel')||proj.views.has('proxy');
  const spChanged=proj.views.has('providers')||proj.views.has('rules');
  const fwChangedIds=changedForwardTunnels(baselineState,S);
  let configSaved=false,syncMessage='';
  deps.setSaving(true,syncRules?(dirty?'保存并同步中…':'同步中…'):'保存中…');
  try{
    if(dirty){
      const r=await deps.fetch(deps.api,{method:'PUT',headers:apiHeaders(deps.token,{'Content-Type':'application/json'}),body:JSON.stringify(S)});
      const d=await r.json();
      if(!d.ok){deps.toast((d.errors||['未知错误']).join('；'),true);return out;}
      deps.commitConfig(cloneData(S));configSaved=true;out.configSaved=true;
    }
    if(syncRules){
      // #3 验收 9：写入外部 ~/.claude/settings.json 前先取只读预览并让用户
      // 确认。预览失败按失败关闭——拿不到真实 diff 就绝不落盘；already
      // 状态无变更，免确认直接走幂等路径。
      let go=true;
      try{
        const pr=await deps.fetch('/api/cc-sync-preview',{method:'POST',headers:apiHeaders(deps.token,{'Content-Type':'application/json'}),body:JSON.stringify({roles:ccRoles})});
        const pv=await pr.json();
        if(!pv.ok){go=false;deps.toast('同步预览失败：'+(pv.msg||'未知错误')+'，未写入',true);}
        else if(!pv.already)go=await deps.confirmSync(pv);
      }catch(e){go=false;deps.toast('同步预览失败：'+e.message+'，未写入',true);}
      if(!go){
        if(configSaved){deps.stampSaved(deps.now());deps.toast('网关配置已保存；已取消写入 Claude Code（同步仍标记未保存）');}
        else deps.toast('已取消，未写入 Claude Code');
        out.cancelled=true;return out;
      }
      const r=await deps.fetch('/api/setup-claude-code',{method:'POST',headers:apiHeaders(deps.token,{'Content-Type':'application/json'}),body:JSON.stringify({roles:ccRoles})});
      const d=await r.json();
      if(!d.ok){deps.toast((configSaved?'网关配置已保存，但 ':'')+'同步失败：'+(d.msg||'未知错误'),true);return out;}
      deps.commitRoles(cloneData(ccRoles));syncMessage=d.msg||'已同步到 Claude Code';out.syncOk=true;
    }
    deps.stampSaved(deps.now());
    if(configSaved){
      const names=[...proj.views].map(v=>deps.viewTitle(v)).join('、');
      let msg=`已保存 ${proj.total} 项（${names}）`;
      if(mpChanged&&spChanged)msg+=' — 代理需重新连接（隧道页「重新连接」或菜单栏），AI 路由已自动重载';
      else if(mpChanged)msg+=' — 点击隧道页「重新连接」或菜单栏生效';
      else if(spChanged)msg+=' — AI 路由已自动重载';
      if(fwChangedIds.length&&deps.reconnectForwards){
        // 多活守卫重连：代理隧道保持 v0.8 语义（保存前后同身份的当前
        // 隧道才触发）；运行中的转发会话按 tunnel_id 定向守卫——原生侧
        // 按各自连接态拦，未连接/未运行的绝不拉起
        const baseIdx=proxyIndexOf(baselineState),saveIdx=proxyIndexOf(S);
        const baseCur=(baselineState.mp.tunnels||[])[baseIdx]||null;
        const saveCur=(S.mp.tunnels||[])[saveIdx]||null;
        const sameProxy=!!(baseCur&&saveCur&&baseCur.id&&saveCur.id===baseCur.id);
        const proxyId=saveCur&&saveCur.id;
        fwChangedIds.forEach(id=>{
          if(id===proxyId){
            if(sameProxy)deps.reconnectForwards(null);
          }else if(((S.mp.tunnels||[]).find(t=>t&&t.id===id)||{}).forward_running){
            deps.reconnectForwards(id);
          }
        });
        msg+='；端口转发变更已触发自动重连';
      }
      if(syncMessage)msg+='；'+syncMessage;
      deps.toast(msg);
    }else deps.toast(syncMessage);
  }catch(e){
    deps.toast((configSaved?'配置已保存，后续操作失败：':'保存失败：')+e.message,true);
  }finally{
    deps.setSaving(false);
  }
  return out;
}

// ── dirty ─────────────────────────────────────────────
// 设置窗桥接：单一 bridge 通道，{type, payload} JSON；JS 拥有 DOM 与 dirty 真相
function nativeSend(type,payload){
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.bridge)
    window.webkit.messageHandlers.bridge.postMessage({type:type,payload:payload||{}});
}
function notifyNative(){nativeSend('dirtyState',{dirty:dirty});}
function totalDirtyCount(){return[...dirtyCounts.values()].reduce((sum,n)=>sum+n,0);}
function recomputeDirty(){
  const p=dirtyProjection(baselineState,S,baselineRoles,ccRoles);
  dirtyViews=p.views;dirtyCounts=p.counts;dirty=dirtyViews.size>0;
  updateStatus();notifyNative();
}
function collectAndRecompute(){collect();recomputeDirty();}
function captureBaseline(saved){
  baselineState=cloneData(S);baselineRoles=cloneData(ccRoles);
  dirty=false;dirtyViews.clear();dirtyCounts.clear();
  if(saved)lastSavedAt=new Date().toLocaleTimeString('zh-CN');
  updateStatus();notifyNative();
}
function discardAll(){
  const count=totalDirtyCount();if(!count)return;
  S=normalizeState(cloneData(baselineState));ccRoles=cloneData(baselineRoles);credModeOverride='';
  activeTunnel=Math.min(activeTunnel,Math.max(0,S.mp.tunnels.length-1));
  if(!S.sp.providers[activeProvider])activeProvider=Object.keys(S.sp.providers)[0]||'';
  recomputeDirty();renderNav();renderView();toast(`已放弃 ${count} 项改动`);
}
function refreshPendingBar(){
  const bar=document.getElementById('pending-bar');
  const count=totalDirtyCount();bar.hidden=!dirty;
  if(!dirty)return;
  document.getElementById('pending-title').textContent=`${count} 项待保存`;
  document.getElementById('pending-items').innerHTML=[...dirtyViews].map(view=>
    `<button class="pending-item" onclick="setView('${view}')">${esc(VIEWS[view].title)} · ${dirtyCounts.get(view)} 项</button>`
  ).join('');
  document.getElementById('pending-save-btn').disabled=saving;
}
function refreshSaveBtn(){
  const btn=document.getElementById('save-btn');
  if(saving){btn.disabled=true;return;}
  const view=VIEWS[activeView]||VIEWS.tunnel;
  btn.classList.toggle('dirty',dirty&&!view.readOnly);
  // 快速接入：readOnly 但有专属主操作——头部按钮即全站「保存」位（CC 页先例）
  if(activeView==='quickstart'){
    btn.textContent=qs.busy?'配置中…':'保存供应商并配置 Agent';
    btn.disabled=!!qs.busy;
    btn.title='';
    return;
  }
  if(view.readOnly){btn.textContent='刷新';btn.disabled=false;btn.title=`刷新${view.title}`;return;}
  const count=totalDirtyCount(),crossPage=dirtyViews.size>1||(dirty&&!dirtyViews.has(activeView));
  if(activeView==='rules'){
    btn.textContent=dirty?(crossPage?`保存全部并同步 · ${count} 项`:`保存并同步 · ${count} 项`):'同步到 Claude Code';
    btn.disabled=false;
  }else{
    btn.textContent=dirty?(crossPage?`保存全部 · ${count} 项`:`保存更改 · ${count} 项`):'保存更改';
    btn.disabled=!dirty;
  }
  btn.title='';
}
function updateStatus(){
  const el=document.getElementById('status-left');
  if(dirty){el.textContent=`● ${totalDirtyCount()} 项未保存 · ${dirtyViews.size} 个页面`;el.classList.add('dirty');}
  else if(lastSavedAt){el.textContent='已保存 · '+lastSavedAt;el.classList.remove('dirty');}
  else{el.textContent='就绪';el.classList.remove('dirty');}
  const hint=document.getElementById('shortcut-hint');
  hint.textContent=dirty?'⌘S 保存全部':(activeView==='quickstart'?'⌘S 应用 · ⌘R 刷新':(VIEWS[activeView]&&VIEWS[activeView].readOnly?'⌘R 刷新':'⌘S 保存'));
  refreshPendingBar();refreshSaveBtn();
}

// ── confirm-delete helper ─────────────────────────────
function cdel(btn,fn){
  if(btn.dataset.cf==='1'){btn.dataset.cf='';fn();return;}
  btn.dataset.cf='1';
  btn._oh=btn.innerHTML;
  if(!btn.classList.contains('btn-icon'))btn.innerHTML='确认删除？';
  btn.classList.add('btn-confirm');
  setTimeout(()=>{if(btn.dataset.cf==='1'){btn.dataset.cf='';btn.innerHTML=btn._oh;btn.classList.remove('btn-confirm');}},3000);
}

// ── nav (grouped) ─────────────────────────────────────
function renderNav(){
  let html='';
  for(const group of NAV_ORDER){
    html+=`<div class="nav-group"><div class="nav-label">${group}</div><nav class="side-nav" aria-label="${group}">`;
    html+=Object.entries(VIEWS).filter(([_,v])=>v.group===group).map(([id,v])=>
      `<button class="nav-item" data-view="${id}" ${id===activeView?'aria-current="page"':''} onclick="setView('${id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${v.icon}</svg><span class="nav-text"><span>${v.title}</span><span class="nav-sub">${v.sub||''}</span></span></button>`).join('');
    html+=`</nav></div>`;
  }
  document.getElementById('nav-container').innerHTML=html;
}
function setView(id){
  if(id===activeView)return;
  collectAndRecompute();
  const previous=VIEWS[activeView];
  if(previous&&previous.leave)previous.leave();
  activeView=id;
  try{localStorage.setItem('mar.lastView',id);}catch(e){}
  renderNav();renderView();
}
function renderView(){
  const vp=document.getElementById('viewport');vp.innerHTML='';
  const v=VIEWS[activeView]||VIEWS.tunnel;
  document.getElementById('page-title').textContent=v.title;
  document.getElementById('page-subtitle').textContent=v.sub||'';
  updateStatus();
  vp.innerHTML=v.render();
  vp.firstElementChild.classList.add('is-active');
  associateLabels();
  if(v.enter)v.enter();
  if(activeView==='rules'){
    ccRenderRoles();ccRenderDefault();ccRenderDrift();
    associateLabels();
    if(!Object.keys(ccRoles).length)ccInitRoles(); // fetches then re-renders
  }
}
// 无障碍：为视口内每个 label 建立真实 for/id 关联（#3）。
// 字段结构统一是 .field > label + control（或 label + .key-field > input），
// 一处后处理覆盖全部页面，新增字段自动生效。
let _labelSeq=0;
function associateLabels(){
  document.querySelectorAll('#viewport label').forEach(label=>{
    if(label.htmlFor)return;
    const ctl=label.parentElement.querySelector('input:not([type=checkbox]):not([type=radio]),select');
    if(!ctl||label.contains(ctl))return;  // 包裹式 label 已隐式关联
    if(!ctl.id)ctl.id='ctl-'+(++_labelSeq);
    label.htmlFor=ctl.id;
  });
}
function stopViewRefresh(view){
  if(refreshTimers[view]){
    clearTimeout(refreshTimers[view]);
    delete refreshTimers[view];
  }
}
function scheduleViewRefresh(view,refresh){
  stopViewRefresh(view);
  refreshTimers[view]=setTimeout(()=>{
    delete refreshTimers[view];
    if(activeView===view)refresh(true);
  },60000);
}

// ── load / save ───────────────────────────────────────
async function load(){
  try{const r=await fetch(API,{headers:apiHeaders(null)});S=normalizeState(await r.json());}
  catch(e){document.getElementById('viewport').innerHTML='<div class="view is-active" style="padding:40px;color:var(--muted)">加载失败：'+esc(e.message)+'</div>';return;}
  // #51：模板装填 best-effort，不阻塞主状态（fetch 属 L2）
  fetch('/api/provider-templates',{headers:apiHeaders(null)})
    .then(r=>r.ok?r.json():null)
    .then(tpl=>{
      if(!tpl)return;
      setProviderTemplates(tpl);
      // 竞态收口：lastView=providers 时首屏可能已以 custom-only 渲染
      if(VIEWS[activeView]===VIEWS.providers)renderView();
    })
    .catch(()=>{});
  try{const lv=localStorage.getItem('mar.lastView');if(lv&&VIEWS[lv])activeView=lv;}catch(e){}
  // 菜单「配置 Agent…」深链：#quickstart 直达快速接入向导（优先于 lastView）
  if(location.hash==='#quickstart'&&VIEWS.quickstart)activeView='quickstart';
  activeTunnel=proxyIndexOf(S);
  activeProvider=Object.keys(S.sp.providers)[0]||'';credModeOverride='';
  lastSavedAt='';captureBaseline(false);renderNav();renderView();
}
function primaryAction(){
  const view=VIEWS[activeView]||VIEWS.tunnel;
  if(activeView==='quickstart'){qsApply();return;}
  if(view.readOnly){if(view.refresh)view.refresh();return;}
  saveAll(activeView==='rules');
}
function save(){return saveAll(false);}
function saveRules(){return saveAll(true);}
function setSavingState(on,label){
  saving=on;
  const btn=document.getElementById('save-btn');
  if(on&&label)btn.textContent=label;
  updateStatus();
}
// ── CC 同步确认弹窗（#3 验收 9）────────────────────────
// 展示 /api/cc-sync-preview 的目标文件、变更 diff、备份策略；resolve(true)
// 才继续写入。默认焦点给「取消」（最小破坏动作），Escape/遮罩点击=取消，
// Tab 在弹窗按钮间循环；关闭后焦点还原到触发元素。
function ccConfirmSync(pv){
  return new Promise(resolve=>{
    const prev=document.activeElement;
    const rows=ccPreviewRows(pv);
    const ov=document.createElement('div');
    ov.className='cc-modal-overlay';
    ov.innerHTML=`<div class="cc-modal" role="dialog" aria-modal="true" aria-labelledby="cc-modal-title" aria-describedby="cc-modal-target">
      <h3 id="cc-modal-title">写入 Claude Code 配置</h3>
      <p class="cc-modal-target" id="cc-modal-target">目标文件 <code class="mono">${esc(pv.target)}</code>${pv.exists?'':'（不存在，将新建）'}</p>
      <div class="cc-modal-sec">将写入 ${rows.length} 项变更</div>
      <div class="cc-diff-scroll"><table class="cc-diff-table"><thead><tr><th>环境变量</th><th>操作</th><th>原值</th><th>新值</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td class="mono">${esc(r.key)}</td><td><span class="cc-badge cc-badge-${esc(r.badge)}">${esc(r.badge)}</span></td><td class="mono">${esc(r.old)}</td><td class="mono">${esc(r.new)}</td></tr>`).join('')}</tbody></table></div>
      <p class="cc-modal-backup">${esc(ccBackupNote(pv))}</p>
      <p class="cc-modal-hint">写入经原子替换（0600），重启 Claude Code 后生效</p>
      <div class="cc-modal-actions">
        <button type="button" class="btn" id="cc-modal-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="cc-modal-ok">确认写入</button>
      </div></div>`;
    const done=ok=>{document.removeEventListener('keydown',onKey,true);ov.remove();if(prev&&prev.focus)prev.focus();resolve(ok);};
    const onKey=e=>{
      if(e.key==='Escape'){e.stopPropagation();done(false);}
      else if(e.key==='Tab'){e.preventDefault();const f=[...ov.querySelectorAll('button')];const i=f.indexOf(document.activeElement);f[(i+1)%f.length].focus();}
    };
    document.addEventListener('keydown',onKey,true);
    ov.addEventListener('click',e=>{if(e.target===ov)done(false);});
    ov.querySelector('#cc-modal-cancel').addEventListener('click',()=>done(false));
    ov.querySelector('#cc-modal-ok').addEventListener('click',()=>done(true));
    document.body.appendChild(ov);
    ov.querySelector('#cc-modal-cancel').focus();
  });
}

async function saveAll(forceRulesSync){
  // 薄胶水：读表单 → 接线 deps → 交给 LAYER 1 状态机。保存流的全部逻辑
  // （校验/两阶段写入/失败关闭/取消/baseline 推进/分支 toast）在 saveFlow，
  // node 测试直接钉住；本函数只剩 DOM 接线与重入保护。
  if(saving)return;
  collect(true);recomputeDirty();
  await saveFlow(
    {S,ccRoles,baselineState,baselineRoles},
    {
      fetch:(...a)=>fetch(...a),api:API,token:'',
      confirmSync:ccConfirmSync,toast,gotoFirstError,
      viewTitle:v=>(VIEWS[v]||{}).title||v,
      commitConfig:st=>{baselineState=st;},
      commitRoles:rl=>{baselineRoles=rl;},
      stampSaved:at=>{lastSavedAt=at;},
      setSaving:setSavingState,
      // 端口转发保存后的守卫重连（if_connected：原生侧仅在隧道已连接时
      // 执行——浏览器直开无桥接时 no-op；tunnelId 定向转发会话，null=代理）
      reconnectForwards:(tunnelId)=>nativeSend('reconnectProxy',
        {if_connected:true,...(tunnelId?{tunnel_id:tunnelId}:{})}),
      now:()=>new Date().toLocaleTimeString('zh-CN'),
    },
    forceRulesSync);
  recomputeDirty();  // 覆盖取消/失败/成功全部出口的状态栏与 pending bar 刷新
}
let _toastGen=0;  // #72 R7a：代际守卫——旧 toast 的超时不得提前藏掉新 toast
function toast(msg,err){
  const t=document.getElementById('toast');document.getElementById('toast-msg').textContent=msg;
  t.setAttribute('role',err?'alert':'status');
  t.className='toast is-visible'+(err?' err':'');
  const gen=++_toastGen;
  // Long messages (e.g. sync results with backup paths) need more read time.
  setTimeout(()=>{if(gen===_toastGen)t.classList.remove('is-visible');},(err||msg.length>40)?6000:4000);
}
function toggleSwitch(el){
  const on=el.getAttribute('aria-checked')!=='true';el.setAttribute('aria-checked',on);
  const lbl=el.parentElement.querySelector('.switch-label');if(lbl)lbl.textContent=on?'已启用':'已停用';collectAndRecompute();
}

  S.mp.current_tunnel_id=t.id||'';

  recomputeDirty();renderView();

// 删除时保全代理角色：删的是角色隧道（id 匹配）→ 清空 id 真相，靠下标
// 钳制回落剩余首条；删前方隧道下标前移——角色始终指向同一条隧道
function removeTunnel(i){if(!S.mp.tunnels.length)return;collectTunnel();const removed=S.mp.tunnels[i];S.mp.tunnels.splice(i,1);if(removed&&removed.id&&(removed.id===(S.mp.current_tunnel_id||'')))S.mp.current_tunnel_id='';const cur=S.mp.current_tunnel||0;if(i<cur)S.mp.current_tunnel=cur-1;else if(i===cur)S.mp.current_tunnel=Math.max(0,Math.min(cur,S.mp.tunnels.length-1));activeTunnel=Math.max(0,Math.min(i,S.mp.tunnels.length-1));recomputeDirty();renderView();}
function addForward(){collectTunnel();const t=S.mp.tunnels[activeTunnel];if(!t)return;(t.forwards=t.forwards||[]).push({local_port:0,remote_host:'127.0.0.1',remote_port:0});recomputeDirty();renderView();}
function removeForward(fi){collectTunnel();const t=S.mp.tunnels[activeTunnel];if(!t||!(t.forwards||[]).length)return;t.forwards.splice(fi,1);recomputeDirty();renderView();}
function collectTunnel(){
  const ts=S.mp.tunnels;if(!ts.length)return;const t=ts[activeTunnel];if(!t)return;
  const d=document.querySelector('.md-detail .detail-body');if(!d)return;
  const v=f=>{const el=d.querySelector(`[data-tf="${f}"]`);return el?el.value:'';};
  t.name=v('name').trim();const a=parseAddr(v('addr'));
  t.ssh_user=a.user;t.ssh_host=a.host;
  t.ssh_port=parseInt(v('ssh_port'))||22;t.auth_type=v('auth')||'key';t.ssh_key=v('key');
  // 空输入恢复 null：密码是掩码字段，清空 = 不改（服务器只在非空时写钥匙串），
  // 残留旧值会让 dirty 卡住并把幽灵密码静默写入。
  const pw=v('pw');t.password=pw||null;

  // 同一语义：空端口=0、空地址=127.0.0.1
  const fws=[];
  d.querySelectorAll('.fw-table tbody tr[data-fwr]').forEach(tr=>{
    const g=k=>{const el=tr.querySelector(`[data-fwf="${k}"]`);return el?el.value:'';};
    fws.push({local_port:parseInt(g('local_port'),10)||0,
      remote_host:g('remote_host').trim()||'127.0.0.1',
      remote_port:parseInt(g('remote_port'),10)||0});
  });
  t.forwards=fws;
}

async function testTunnel(btn){

  try{

// 行内端口转发测试：探测的是表单当前值（collect 后的隧道 + t.forwards[fi]），
// 未保存的新隧道/新行同样可测——后端 probe_forward 不依赖隧道当前状态。
async function testForward(fi,btn){

  if(!(i>=0&&i<ts.length)){toast('没有可测试的隧道',true);return;}
  const f=((ts[i].forwards)||[])[fi];
  if(!f){toast('转发行不存在',true);return;}
  const st=document.getElementById('fw-status-'+fi);

  btn.disabled=true;btn.textContent='测试中…';set('测试中…','');

// 重连 = 菜单栏「重新连接」等价动作（Python 端停隧道→重读配置→重启），
// 经 bridge 触发；tunnelId 定向该隧道的转发会话（多活），缺省 = 代理会话。
// 浏览器直开设置页时无桥接，回退提示。
function reconnectProxy(btn,tunnelId){
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.bridge){
    if(btn){btn.disabled=true;btn.textContent='重连中…';
      setTimeout(()=>{btn.disabled=false;btn.textContent='重新连接';},4000);}
    nativeSend('reconnectProxy',tunnelId?{tunnel_id:tunnelId}:{});
  }else toast('重新连接需在应用的设置窗内使用');
}
// 多活：非代理隧道的转发会话启停（会话编排归原生侧 coordinator）
function toggleForwardSession(btn,tunnelId,action){
  if(!tunnelId){toast('该隧道尚未保存，请先保存再启动转发',true);return;}
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.bridge){
    nativeSend('forwardSession',{tunnel_id:tunnelId,action:action==='stop'?'stop':'start'});
    btn.disabled=true;
    setTimeout(()=>{recomputeDirty();renderView();},1200);
  }else toast('端口转发启停需在应用的设置窗内使用');
}

const NFS_POLL_MS=5000;
let nfsPollTimer=null;
function nfsStopPoll(){if(nfsPollTimer){clearTimeout(nfsPollTimer);nfsPollTimer=null;}}
function nfsPollLoop(){
  nfsStopPoll();
  nfsPollTimer=setTimeout(async()=>{
    if(activeView!=='nfs')return;
    await nfsRefreshRuntime();
    if(activeView==='nfs')nfsPollLoop();
  },NFS_POLL_MS);
}
async function nfsRefreshRuntime(){
  let d;try{const r=await fetch('/api/state',{headers:apiHeaders(null)});
    if(!r.ok)return;d=await r.json();}catch(e){return;}
  mergeRuntimeDecorations(S,d);   // 只合并装饰字段，表单不动
  nfsUpdateStatusCells();          // 定向 DOM 更新，不 renderView
}
function nfsUpdateStatusCells(){
  const t=(S.mp.tunnels||[])[activeTunnel];if(!t)return;
  const states=t.nfs_states||{};
  ((t.nfs||{}).mounts||[]).forEach((m,mi)=>{
    if(!m||!m.name)return;
    const o=nfsStateOf(states,m.name);
    const [lbl,cls]=NFS_STATUS_LABEL[o.status]||NFS_STATUS_LABEL.unmounted;
    const stEl=document.getElementById('nfs-st-'+mi);
    if(stEl){stEl.textContent=lbl;stEl.className='fw-status '+(cls||'');stEl.title=o.error||'';}
    const errEl=document.getElementById('nfs-err-'+mi);
    if(errEl){const show=o.status==='error';errEl.hidden=!show;
      if(show)errEl.textContent=(o.error||'').slice(0,90);}
    const fixEl=document.getElementById('nfs-fix-'+mi);
    if(fixEl)fixEl.hidden=!(o.status==='error'&&o.fixable==='exports');
  });
}
async function nfsFixExports(mi,btn){
  collectNfs();const ts=S.mp.tunnels||[],i=activeTunnel;
  const t=ts[i];if(!t)return;
  const n=t.nfs||{};
  const row=(n.mounts||[])[mi];
  const mounts=[...new Set((n.mounts||[]).map(m=>(m.remote_path||'').trim()).filter(p=>p&&p.startsWith('/')))];
  if(!mounts.length){toast('请先填写有效的远程路径',true);return;}
  const pwEl=document.querySelector('.md-detail [data-nf="sudo_pw"]');
  const orig=btn.textContent;btn.disabled=true;btn.textContent='修复中…';
  _setNfsResult('修复中…（重建远端导出表，秒级）','var(--muted)');
  try{
    const r=await fetch('/api/nfs-setup-remote',{method:'POST',headers:apiHeaders(null,{'Content-Type':'application/json'}),
      body:JSON.stringify({tunnel:t,mounts,squash:n.squash_to_ssh_user===true,sudo_password:pwEl?pwEl.value:''})});
    const d=await r.json();
    if(d.ok){
      _setNfsResult('✅ 导出已修复——重新挂载 '+((row&&row.name)||'')+' …','var(--ok)');
      if(t.id&&row&&row.name)
        nativeSend('nfsMountToggle',{tunnel_id:t.id,name:row.name,action:'mount'});
      setTimeout(nfsRefreshRuntime,1500);
    }else{
      _setNfsResult('❌ 修复失败：'+(d.error||'')+(d.stage?`（阶段：${d.stage==='install'?'安装软件包':d.stage==='apply'?'应用导出':'前置检查'}）`:''),'var(--danger)');
    }
  }catch(e){_setNfsResult('❌ 请求失败: '+e.message,'var(--danger)');}
  btn.disabled=false;btn.textContent=orig;
}
function nfsMountAction(btn,mi,action){
  collectNfs();const t=S.mp.tunnels[activeTunnel];if(!t)return;
  const m=((t.nfs||{}).mounts||[])[mi];
  if(!m||!m.name){toast('请先填写挂载名',true);return;}
  if(!t.id){toast('该隧道尚未保存，请先保存再挂载',true);return;}

    setTimeout(nfsRefreshRuntime,1500);
    setTimeout(nfsRefreshRuntime,4000);
  }else toast('挂载操作需在应用的设置窗内使用');
}

function validatePort(el){

function collectProvider(){
  const d=document.querySelector('.md-detail .detail-body');if(!d||!activeProvider)return;
  const p=S.sp.providers[activeProvider];if(!p)return;
  const v=f=>{const el=d.querySelector(`[data-pf="${f}"]`);return el?el.value:'';};
  const newName=v('name').trim()||activeProvider;
  p.base_url=v('base_url').trim();
  // api_key_set 是服务器掩码真相（suanpan/config.py _restore_key 的 keep 入参），
  // JS 只回传、永不改写；清空输入 = api_key 恢复 null（保留已存 key）。
  const keyVal=v('api_key');p.api_key=keyVal||null;
  p.api_key_env=v('api_key_env').trim()||null;
  p.auth_header=v('auth_header')||null;
  const sw=d.querySelector('[data-pf="enabled"]');p.enabled=sw&&sw.getAttribute('aria-checked')==='true';
  const swAN=d.querySelector('[data-pf="anthropic_native"]');p.anthropic_native=swAN&&swAN.getAttribute('aria-checked')==='true';
  if(newName!==activeProvider){
    if(S.sp.providers[newName]){toast('供应商名称「'+newName+'」已被占用，未重命名',true);return;}
    const oldName=activeProvider;
    const np={};for(const[k2,v2]of Object.entries(S.sp.providers))np[k2===activeProvider?newName:k2]=v2;S.sp.providers=np;activeProvider=newName;
    // Update rule references
    const prefix=oldName+'/';
    (S.sp.rules||[]).forEach(r=>{if(r.route_to&&r.route_to.startsWith(prefix))r.route_to=newName+'/'+r.route_to.substring(prefix.length);});
    if(S.sp.router&&S.sp.router.default&&S.sp.router.default.startsWith(prefix))S.sp.router.default=newName+'/'+S.sp.router.default.substring(prefix.length);
    // #72 R7a：ccRoles 的 model 引用同步改写——悬空后经 fall-through
    // 静默误投（路由侧只认 provider 名）
    Object.values(ccRoles||{}).forEach(r=>{
      if(r&&r.model&&r.model.startsWith(prefix))r.model=newName+'/'+r.model.substring(prefix.length);
    });
  }
}
async function fetchProviderModels(btn){
  collectProvider();
  const name=activeProvider,errEl=document.getElementById('models-error');
  if(errEl)errEl.textContent='';
  btn.disabled=true;btn.textContent='拉取中…';
  const restore=()=>{btn.disabled=false;btn.textContent='从 API 拉取';};
  try{
    const r=await fetch('/api/fetch-models',{method:'POST',headers:apiHeaders(null,{'Content-Type':'application/json'}),body:JSON.stringify({provider:name})});
    const d=await r.json();
    if(d.error){if(errEl)errEl.textContent=d.error;restore();}
    else{
      // Union-merge: hand-added models survive a fetch; new API entries append.
      const cur=S.sp.providers[name].models||[];
      (d.models||[]).forEach(m=>{if(!cur.includes(m))cur.push(m);});
      S.sp.providers[name].models=cur;recomputeDirty();renderView();
    }
  }catch(e){if(errEl)errEl.textContent='请求失败: '+e;restore();}
}

}

function dailyBarsSVG(daily,metric){
  const bars=dailyBarData(daily,metric);
  if(bars.length<2)return'';
  const def=DAILY_METRICS[metric]||DAILY_METRICS.input;
  const SLOT=12,BAR=7,H=48,W=bars.length*SLOT;
  const rects=bars.map((b,i)=>{
    if(!b.ratio)return'';  // 无消耗的日子留空位（间隔即日历）
    const h=Math.max(2,b.ratio*(H-2));
    return `<rect x="${(i*SLOT+(SLOT-BAR)/2).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${BAR}" height="${h.toFixed(1)}" rx="1.5"><title>${esc(b.title)}</title></rect>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="每日${esc(def.label)}趋势（最右为最近一天）" style="max-width:${W}px">${rects}</svg>`;
