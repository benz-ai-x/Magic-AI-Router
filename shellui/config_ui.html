// ── Claude Code sync ──────────────────────────────────
// In-memory role state: {key: {model, name, ctx_1m}}.  The role list
// (order/labels/readonly) comes from /api/cc-default-roles — Python's
// _ROLES is the single source of truth (#44); the UI has no parallel list.
let ccRoles={};
let ccRoleMeta={};
// 用户已点「按路由规则重置」——横幅文案切到保存提示；重新加载种子时复位。
let ccDriftAck=false;

async function ccInitRoles(){
  try{
    const r=await fetch('/api/cc-default-roles',{headers:apiHeaders(null)});
    const d=(await r.json())||{};
    // 边界加固：角色 key 会进 onclick 单引号串、label 进 innerHTML——
    // 当前来源是 Python 常量，但按不可信载荷处理，白名单过滤一劳永逸。
    d.order=(d.order||[]).filter(k=>/^[\w-]+$/.test(k));
    ccRoles=d.roles||{};
    ccRoleMeta=d;
  }catch(e){ccRoles={};ccRoleMeta={};}
  ccDriftAck=false;
  baselineRoles=cloneData(ccRoles);
  ccRenderRoles();ccRenderDefault();ccRenderDrift();recomputeDirty();
}

// 漂移横幅：synced+drift 时展示（ccDriftInfo 纯函数定文案/按钮）。
// DOM 每次进 rules 视图重建，所以 renderView 与 ccInitRoles 都要重画。
function ccRenderDrift(){
  const el=document.getElementById('cc-drift-banner');
  if(!el)return;
  const info=ccDriftInfo(ccRoleMeta,{acked:ccDriftAck});
  el.hidden=!info.show;
  if(!info.show)return;
  const text=document.getElementById('cc-drift-text');
  if(text)text.textContent='⚠️ '+info.text;
  // 按钮按需注入（重置后消失）；id 钉住避免重复 append
  let btn=document.getElementById('cc-drift-reset');
  if(info.reset&&!btn){
    btn=document.createElement('button');
    btn.className='btn btn-sm';btn.id='cc-drift-reset';
    btn.textContent='按路由规则重置';btn.onclick=ccResetSeed;
    el.appendChild(btn);
  }else if(!info.reset&&btn){btn.remove();}
}

async function ccResetSeed(){
  try{
    const r=await fetch('/api/cc-default-roles?seed=rules',{headers:apiHeaders(null)});
    const d=(await r.json())||{};
    d.order=(d.order||[]).filter(k=>/^[\w-]+$/.test(k));
    ccRoles=d.roles||{};ccRoleMeta=d;
  }catch(e){return;}
  ccDriftAck=true;
  ccRenderRoles();ccRenderDefault();ccRenderDrift();recomputeDirty();
}

function ccRenderRoles(){
  const tbody=document.getElementById('cc-roles-body');
  if(!tbody)return;
  tbody.innerHTML=ccRoleRows(ccRoleMeta).map(r=>{
    const role=ccRoles[r.key]||{model:'',ctx_1m:true};
    const nameInput=r.readonly
      ?'<input class="control mono" placeholder="不显示在 /model 菜单" readonly aria-label="'+esc(r.label)+'：显示名称（只读）" style="background:var(--surface);color:var(--muted)">'
      :`<input class="control mono" data-cc-name="${r.key}" value="${esc(role.name||role.model)}" placeholder="显示名称" aria-label="${esc(r.label)}：显示名称" oninput="ccRoleName('${r.key}',this.value)">`;
    const opts=routeTargetOptions(role.model||'','（未设置）');
    const hint=ccRoleHint(r.key);
    return `<tr>
      <td style="font-weight:550;font-size:14px">${esc(r.label)}</td>
      <td>${nameInput}${hint?`<div class="panel-hint" style="margin-top:4px;white-space:nowrap">${esc(hint)}</div>`:''}</td>
      <td><select class="select-control mono" data-cc-role="${r.key}" aria-label="${esc(r.label)}：实际请求模型" onchange="ccRoleChange('${r.key}',this.value)">${opts}</select></td>
      <td style="text-align:center"><input type="checkbox" ${role.ctx_1m?'checked':''} onchange="ccRole1m('${r.key}',this.checked)" aria-label="${esc(r.label)}：声明支持 1M" title="仅声明给 Claude Code 的上下文能力，与模型选项后的上下文注释无关" style="width:16px;height:16px;accent-color:var(--accent)"></td>
    </tr>`;
  }).join('');
}

function ccRoleChange(key,val){
  const role=ccRoleEntry(ccRoles,key);
  // A display name follows the model unless the user customised it.
  if(!role.name||role.name===role.model)role.name=val;
  role.model=val;
  const nameInput=document.querySelector(`[data-cc-name="${key}"]`);
  if(nameInput)nameInput.value=ccRoles[key].name;
}

function ccRoleName(key,val){
  ccRoleEntry(ccRoles,key).name=val;
}

function ccRole1m(key,checked){
  ccRoleEntry(ccRoles,key).ctx_1m=checked;
}

function collectRules(){
  // The fallback belongs to both the gateway config and Claude Code's
  // default role, so a global save cannot silently drop half of the draft.
  const sel=document.getElementById('cc-default-model');
  if(!sel)return;
  const model=sel.value.trim(),ctx=document.getElementById('cc-default-1m')?.checked??true;
  if(model){
    S.sp.router.default=model;
    const role=ccRoleEntry(ccRoles,'default');role.model=model;role.ctx_1m=ctx;
  }else{
    delete S.sp.router.default;delete ccRoles.default;
  }
}

function ccRenderDefault(){
  const sel=document.getElementById('cc-default-model');
  if(!sel)return;
  const cur=(S.sp.router||{}).default||'';
  sel.innerHTML=routeTargetOptions(cur,'（未设置）');
  const checkbox=document.getElementById('cc-default-1m');
  if(checkbox)checkbox.checked=ccRoles.default?.ctx_1m!==false;
}

// ── AI agent helper ───────────────────────────────────
function copyAgentInstructions(){
  // #70 S13：token 拼装移原生侧（#10 后 URL 永不带凭证，此处曾恒空
  // 导致复制的 curl 401）。WKWebView 走 bridge：app 持 expected_token
  // 把完整文本上剪贴板，toast 由原生通知承担。浏览器直开设置页无桥接，
  // 曾是静默空操作（对齐 reconnectProxy 的降级约定）——回退经认证
  // /api/agent-instructions 取同一文案自行写剪贴板。
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.bridge){
    nativeSend('copyAgentInstructions');
    return;
  }
  copyAgentInstructionsViaApi();
}
async function copyAgentInstructionsViaApi(){
  try{
    const r=await fetch('/api/agent-instructions');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d.text)throw new Error('响应缺少文本');
    if(!(await _writeClipboard(d.text)))throw new Error('浏览器拒绝写剪贴板');
    toast('已复制 AI 助手指令');
  }catch(e){
    toast('复制失败：'+(e&&e.message||e),true);
  }
}
async function _writeClipboard(text){
  // 127.0.0.1 属安全上下文，优先异步 Clipboard API；Safari 等场景下
  // 用户手势可能不跨 await 存活，退 execCommand 同步复制兜底。
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  ta.remove();
  return ok;
}

// ══ 快速接入向导（ADR-010 M5）═════════════════════════════════════
// 「一个 Key 进，所有 Agent 通」：厂商模板 + Key → 三级端点探测 →
// Agent 矩阵（推荐协议）→ 确认 diff → 写入。供应商创建走与设置页同一条
// PUT /api/state 管线（复用 validateConfig 首层校验）；Agent 写入走
// agent-setup-preview / setup-agent（Claude Code 复用既有 cc 端点）。
// 视图 readOnly（不进 EDITABLE_VIEWS），所有动作显式即时生效；
// 样式全部走 .qs-* 组件类与页面既有控件形态（rules-table/field/btn），
// 表格内不内嵌表单控件——行高一致由「协议列纯文字 + 选项区在③」保证。
let qs={templateId:'',name:'',key:'',probe:null,agents:null,sel:{},results:[],busy:false};
function qsTemplate(){return PROVIDER_TEMPLATES.find(t=>t.id===qs.templateId)||null;}
// 模板 → 主端点选择：优先 anthropic 卡（保 cache_control），无则 openai 卡
function qsPickEndpoint(t){
  const ep=(t&&t.endpoints)||{};
  if(ep.anthropic&&ep.anthropic.base_url)return{protocol:'anthropic',base_url:ep.anthropic.base_url,
    anthropic_native:ep.anthropic.anthropic_native===true,auth_header:ep.anthropic.auth_header||null};
  if(ep.openai&&ep.openai.base_url)return{protocol:'openai',base_url:ep.openai.base_url,
    anthropic_native:false,auth_header:null};
  return null;
}
function qsTemplates(){
  return PROVIDER_TEMPLATES.filter(t=>t.endpoints&&Object.keys(t.endpoints).length);
}
function qsPick(id){
  qs.templateId=id;qs.name=id;qs.probe=null;qs.results=[];
  if(activeView==='quickstart')renderView();
}
// 所选厂商的模型清单（P0 修复：不再回退到默认路由供应商——那会把别家
// 厂商的模型灌进 Codex 下拉）。探测结果 > 同名已保存供应商 > 空。
function qsVendorModels(){
  if(qs.probe){
    const p=qs.probe;
    const list=(p.anthropic&&p.anthropic.models)||(p.openai&&p.openai.models)||[];
    if(list.length)return list;
  }
  const existing=(((S.sp||{}).providers)||{})[qs.name];
  return(existing&&existing.models)||[];
}
// 所选厂商是否可服务 Codex：模板有 responses 端点卡，或同名已保存供应
// 商已配 responses_base_url（P0 修复：失败前置到矩阵行，而非应用时才报）
function qsVendorHasResponses(){
  const t=qsTemplate();
  const viaTpl=!!(t&&t.endpoints&&t.endpoints.responses&&t.endpoints.responses.base_url);
  const existing=(((S.sp||{}).providers)||{})[qs.name];
  return viaTpl||!!(existing&&existing.responses_base_url);
}
function qsSet(field,v){qs[field]=v;}
function qsToggle(id,on){qs.sel[id]=on;if(activeView==='quickstart')renderView();}

function qsAgentRow(a){
  const checked=qs.sel[a.id]!==undefined?qs.sel[a.id]:(a.installed&&!a.synced);
  let sub='',proto='',dis=false;
  if(a.id==='codex'){
    proto='Responses';
    if(!qsVendorHasResponses()){
      dis=true;sub='该厂商无 Responses 端点，暂不支持 Codex';
      proto='<span class="qs-state-muted">Responses（不可用）</span>';
    }
  }else if(a.id==='opencode')proto='Anthropic / OpenAI（在③选择）';
  else if(a.id==='claude-code')proto='Anthropic · 角色映射';
  else proto='Anthropic';
  if(!a.installed&&!sub)sub='未安装——安装后再来配置';
  if(a.id==='claude-code'&&a.synced&&!sub)sub='已同步过，重复配置无副作用';
  const state=a.synced
    ?'<span class="qs-state-ok">✓ 已同步</span>'
    :(a.installed?'<span class="qs-state-default">已安装</span>':'<span class="qs-state-muted">未安装</span>');
  const box=a.installed&&!dis
    ?`<input type="checkbox" ${checked?'checked':''} onchange="qsToggle('${esc(a.id)}',this.checked)" style="width:16px;height:16px;accent-color:var(--accent)" aria-label="配置 ${esc(a.label)}">`
    :`<input type="checkbox" disabled style="width:16px;height:16px;accent-color:var(--accent)" aria-label="${esc(a.label)}（不可用）">`;
  return `<tr${dis?' class="qs-disabled"':''}${a.installed&&!dis?` onclick="qsRowClick(event,'${esc(a.id)}',${!checked})"`:''}>
    <td style="text-align:center;width:40px">${box}</td>
    <td><span class="qs-agent-main">${esc(a.label)}</span>${sub?`<span class="qs-agent-sub">${esc(sub)}</span>`:''}</td>
    <td>${state}</td>
    <td><span class="qs-state-default">${proto}</span></td></tr>`;
}

function qsRowClick(ev,id,on){if(ev.target.closest('input'))return;qsToggle(id,on);}

// ③ 选项区：仅显示与已勾选 Agent 相关的选项（表格里不内嵌控件）
function qsOptionsHTML(){
  const sel=(qs.agents||[]);
  const models=qsVendorModels();
  const parts=[];
  if(sel.some(a=>a.id==='codex'&&qs.sel[a.id])){
    const opts=models.length
      ?models.map(m=>`<option value="${esc(m)}">${esc(m)}${ctxSuffix(m)}</option>`).join('')
      :'';
    parts.push(`<div class="field"><label>Codex 默认模型</label>
      <select class="select-control mono" id="qs-codex-model" ${opts?'':'disabled'}>${opts||'<option value="">（先在①探测端点拉取该厂商的模型）</option>'}</select>
      ${models.length?'':'<p class="field-hint">探测成功后自动填充；也可在供应商页先配置模型清单</p>'}</div>`);
  }
  if(sel.some(a=>a.id==='opencode'&&qs.sel[a.id])){
    parts.push(`<div class="field"><label>OpenCode 协议</label>
      <select class="select-control" id="qs-opencode-proto">
        <option value="anthropic">Anthropic（推荐——保留缓存语义）</option>
        <option value="openai">OpenAI 兼容</option>
      </select></div>`);
  }
  if(!parts.length)return'';
  return `<div class="field-grid">${parts.join('')}</div>`;
}

function quickstartHTML(){
  const chips=qsTemplates().map(t=>
    `<button type="button" class="qs-vendor ${t.id===qs.templateId?'is-active':''}" aria-pressed="${t.id===qs.templateId}" onclick="qsPick('${esc(t.id)}')">${esc(t.label)}</button>`).join('');
  const pick=qsPickEndpoint(qsTemplate());
  const existing=(((S.sp||{}).providers)||{})[qs.name];
  const probeRows=qs.probe?Object.entries(qs.probe).filter(([,v])=>v&&typeof v==='object').map(([proto,r])=>{
    const state=r.reachable?(r.auth_ok===false?'<span class="qs-state-err">✗ Key 无效</span>':(r.auth_ok?'<span class="qs-state-ok">✓ 可用</span>':'<span class="qs-state-default">✓ 端点在</span>'))
      :`<span class="qs-state-muted">✗ ${esc(r.error||'不可达')}</span>`;
    const modelsText=(r.models&&r.models.length)
      ?esc(r.models.slice(0,4).join('、'))+(r.models.length>4?`…（共 ${r.models.length} 个）`:'')
      :'—';
    return`<tr><td class="mono">${esc(proto)}</td><td>${state}</td><td class="mono" style="text-align:right">${r.latency_ms!=null?r.latency_ms+' ms':'—'}</td><td>${modelsText}</td></tr>`;
  }).join(''):'';
  const agentRows=(qs.agents||[]).map(qsAgentRow).join('');
  const resultRows=qs.results.map(r=>`<tr><td><span class="qs-agent-main">${esc(r.agent)}</span></td><td>${r.ok?'<span class="qs-state-ok">✓</span>':'<span class="qs-state-err">✗</span>'}</td><td class="qs-state-muted">${esc(r.msg||'')}</td></tr>`).join('');
  return `<section class="view qs-narrow">
    <p class="module-intro">选厂商填 Key → 自动探测端点 → 勾选 Agent 一键配置；Agent 里写入的是本地网关凭证，厂商 Key 永不落 Agent 配置。</p>
    <div class="panel">
      <div class="section-bar"><h2 class="section-title">① 厂商与 Key</h2></div>
      <div class="detail-body">
        <div class="qs-vendors">${chips||'<p class="loading-text">模板加载中…</p>'}</div>
        <div class="field-grid">
          <div class="field"><label>供应商名</label>
            <input class="control mono" id="qs-name" value="${esc(qs.name)}" oninput="qsSet('name',this.value)" placeholder="如 glm">
            ${existing?'<p class="field-hint">与已有供应商同名——复用配置，不覆盖已存 Key</p>':''}</div>
          <div class="field"><label>API Key</label>
            <div class="key-field"><input class="control mono" id="qs-key" type="password" value="${esc(qs.key)}" oninput="qsSet('key',this.value)" placeholder="${existing?'留空 = 复用已保存的 Key':'粘贴厂商 API Key'}"></div>
            <p class="field-hint">可留空——仅探测端点存在性</p></div>
        </div>
        ${pick?`<p class="panel-hint">将使用 ${esc(pick.protocol==='anthropic'?'Anthropic':'OpenAI')} 端点 <code class="mono">${esc(pick.base_url)}</code></p>`:'<p class="panel-hint">先选择厂商模板——自定义端点请到「供应商」页配置</p>'}
        <div class="qs-actions"><button class="btn btn-sm" onclick="qsProbe()" ${qs.busy?'disabled':''}>${qs.busy?'探测中…':'探测端点'}</button></div>
      </div>
      ${qs.probe?`<div class="table-scroll"><table class="rules-table"><thead><tr><th>协议</th><th>状态</th><th style="text-align:right">延迟</th><th>模型</th></tr></thead><tbody>${probeRows}</tbody></table></div>`:''}
    </div>
    <div class="panel">
      <div class="section-bar"><h2 class="section-title">② Agent 矩阵</h2>
        <div class="section-actions"><button class="btn btn-sm" onclick="qsLoadAgents()">重新检测</button></div></div>
      ${qs.agents===null?'<p class="loading-text">检测中…</p>':qs.agents.length?`<div class="table-scroll"><table class="rules-table qs-agents"><thead><tr><th style="width:40px"></th><th>Agent</th><th>状态</th><th>协议</th></tr></thead><tbody>${agentRows}</tbody></table></div>`:'<p class="loading-text">加载失败，点「重新检测」</p>'}
    </div>
    <div class="panel">
      <div class="section-bar"><h2 class="section-title">③ 应用</h2></div>
      <div class="detail-body">
        ${qsOptionsHTML()}
        <p class="panel-hint">右上角按钮会保存供应商并写入所选 Agent 配置；每个写入前弹出 diff 确认</p>
      </div>
      ${resultRows?`<div class="table-scroll"><table class="rules-table"><thead><tr><th>Agent</th><th style="width:30px"></th><th>结果</th></tr></thead><tbody>${resultRows}</tbody></table></div>`:''}
    </div>
  </section>`;
}

async function qsLoadAgents(){
  try{
    const r=await fetch('/api/agents',{headers:apiHeaders(null)});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    qs.agents=await r.json();
  }catch(e){qs.agents=[];}
  if(activeView==='quickstart')renderView();
}

async function qsProbe(){
  const pick=qsPickEndpoint(qsTemplate());
  if(!pick){toast('请先选择厂商模板',true);return;}
  qs.busy=true;qs.probe=null;renderView();
  try{
    const body={base_url:pick.base_url};
    if(qs.key)body.api_key=qs.key;
    if(pick.auth_header)body.auth_header=pick.auth_header;
    const r=await fetch('/api/probe-provider',{method:'POST',
      headers:apiHeaders(null,{'Content-Type':'application/json'}),
      body:JSON.stringify(body)});
    const d=await r.json();
    qs.probe=d.error?{error:d.error}:d;
    if(d.error)toast('探测失败：'+d.error,true);
  }catch(e){toast('探测失败：'+e.message,true);}
  qs.busy=false;
  if(activeView==='quickstart')renderView();
}

function qsOptionsFor(id){
  const models=qsVendorModels();
  if(id==='codex'){
    const sel=document.getElementById('qs-codex-model');
    return{model:(sel&&sel.value)||models[0]||''};
  }
  if(id==='opencode'){
    const sel=document.getElementById('qs-opencode-proto');
    return{protocol:(sel&&sel.value)||'anthropic',models};
  }
  return{models};
}

// 通用 Agent 写入确认弹窗（ccConfirmSync 的骨架复用：同样的
// target/changes/backup 载荷形状，Escape/遮罩=取消，焦点还原）
function qsConfirm(pv,label){
  return new Promise(resolve=>{
    const prev=document.activeElement;
    const rows=(pv.changes||[]).map(c=>({key:c.key,badge:ccChangeBadge(c.action),
      old:c.old==null?'—':String(c.old),new:c.new==null?'—':String(c.new)}));
    const ov=document.createElement('div');
    ov.className='cc-modal-overlay';
    ov.innerHTML=`<div class="cc-modal" role="dialog" aria-modal="true">
      <h3>写入 ${esc(label)} 配置</h3>
      <p class="cc-modal-target">目标文件 <code class="mono">${esc(pv.target)}</code>${pv.exists?'':'（不存在，将新建）'}</p>
      <div class="cc-modal-sec">将写入 ${rows.length} 项变更</div>
      <div class="cc-diff-scroll"><table class="cc-diff-table"><thead><tr><th>配置项</th><th>操作</th><th>原值</th><th>新值</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td class="mono">${esc(r.key)}</td><td><span class="cc-badge cc-badge-${esc(r.badge)}">${esc(r.badge)}</span></td><td class="mono">${esc(r.old)}</td><td class="mono">${esc(r.new)}</td></tr>`).join('')}</tbody></table></div>
      <p class="cc-modal-backup">${esc((pv.backup&&pv.backup.note)||'')}</p>
      <p class="cc-modal-hint">写入经原子替换（0600），重启该 Agent 后生效</p>
      <div class="cc-modal-actions">
        <button type="button" class="btn" id="qs-modal-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="qs-modal-ok">确认写入</button>
      </div></div>`;
    const done=ok=>{document.removeEventListener('keydown',onKey,true);ov.remove();if(prev&&prev.focus)prev.focus();resolve(ok);};
    const onKey=e=>{
      if(e.key==='Escape'){e.stopPropagation();done(false);}
      else if(e.key==='Tab'){e.preventDefault();const f=[...ov.querySelectorAll('button')];const i=f.indexOf(document.activeElement);f[(i+1)%f.length].focus();}
    };
    document.addEventListener('keydown',onKey,true);
    ov.addEventListener('click',e=>{if(e.target===ov)done(false);});
    ov.querySelector('#qs-modal-cancel').addEventListener('click',()=>done(false));
    ov.querySelector('#qs-modal-ok').addEventListener('click',()=>done(true));
    document.body.appendChild(ov);
    ov.querySelector('#qs-modal-cancel').focus();
  });
}

async function qsPost(url,body){
  const r=await fetch(url,{method:'POST',
    headers:apiHeaders(null,{'Content-Type':'application/json'}),
    body:JSON.stringify(body)});
  return r.json();
}

async function qsApply(){
  const t=qsTemplate();const pick=qsPickEndpoint(t);
  const name=(qs.name||'').trim();
  if(!name){toast('请填写供应商名',true);return;}
  const exists=(((S.sp||{}).providers)||{})[name];
  if(!exists){
    if(!pick){toast('请先选择厂商模板（或到供应商页手动配置）',true);return;}
    if(!qs.key){toast('新供应商需要填写 API Key',true);return;}
  }
  qs.busy=true;qs.results=[];
  if(activeView==='quickstart')renderView();
  try{
    if(!exists){
      const models=qsVendorModels();
      const p={base_url:pick.base_url,api_key:qs.key,
        anthropic_native:pick.anthropic_native,protocol:pick.protocol,
        auth_header:pick.auth_header,enabled:true,models};
      const resp=t&&t.endpoints&&t.endpoints.responses;
      if(resp&&resp.base_url)p.responses_base_url=resp.base_url;
      const next=cloneData(S);
      next.sp.providers[name]=p;
      if(!next.sp.router)next.sp.router={};
      const firstModel=models[0]||'';
      if(!next.sp.router.default&&firstModel)next.sp.router.default=name+'/'+firstModel;
      const errors=validateConfig(next);
      if(errors.length){toast(errors.slice(0,3).join('；'),true);return;}
      const r=await fetch(API,{method:'PUT',
        headers:apiHeaders(null,{'Content-Type':'application/json'}),
        body:JSON.stringify(next)});
      const d=await r.json();
      if(!d.ok){toast((d.errors||['未知错误']).join('；'),true);return;}
      S=normalizeState(next);captureBaseline(true);
      qs.results.push({agent:'供应商 '+name,ok:true,msg:'已保存'});
    }
    const selected=(qs.agents||[]).filter(a=>qs.sel[a.id]&&a.installed);
    for(const a of selected){
      try{
        if(a.id==='codex'&&!qsVendorHasResponses()){
          qs.results.push({agent:a.label,ok:false,msg:'该厂商无 Responses 端点，暂不支持 Codex'});
          continue;
        }
        if(a.id==='claude-code'){
          const pv=await qsPost('/api/cc-sync-preview',{roles:null});
          if(!pv.ok){qs.results.push({agent:a.label,ok:false,msg:pv.msg||'预览失败'});}
          else if(!pv.already&&!(await ccConfirmSync(pv))){qs.results.push({agent:a.label,ok:false,msg:'已取消'});}
          else{
            const d=await qsPost('/api/setup-claude-code',{roles:null});
            qs.results.push({agent:a.label,ok:!!d.ok,msg:d.msg||''});
          }
        }else{
          const options=qsOptionsFor(a.id);
          const pv=await qsPost('/api/agent-setup-preview',{agent:a.id,options});
          if(!pv.ok){qs.results.push({agent:a.label,ok:false,msg:pv.msg||'预览失败'});}
          else if(!pv.already&&!(await qsConfirm(pv,a.label))){qs.results.push({agent:a.label,ok:false,msg:'已取消'});}
          else{
            const d=await qsPost('/api/setup-agent',{agent:a.id,options});
            qs.results.push({agent:a.label,ok:!!d.ok,msg:d.msg||''});
          }
        }
      }catch(e){qs.results.push({agent:a.label,ok:false,msg:e.message});}
      if(activeView==='quickstart')renderView();
    }
    toast(qs.results.every(r=>r.ok)?'配置完成':'部分步骤失败，见结果列表');
    await qsLoadAgents();
  }finally{
    qs.busy=false;
    if(activeView==='quickstart')renderView();
  }
}
Object.assign(VIEWS.quickstart,{
  render:quickstartHTML,refresh:qsLoadAgents,
  enter(){
    // 冷启动默认预选首个模板：chip 选中态 + 供应商名/端点 hint 立即有内容，
    // 用户可改名/换厂商（qsPick 幂等重渲染；renderView 会再调 enter，靠本判据终止）
    if(!qs.templateId&&PROVIDER_TEMPLATES.length>1)qsPick(PROVIDER_TEMPLATES[0].id);
    if(!qs.agents)qsLoadAgents();
  },
});

  if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();activeView==='quickstart'?qsApply():save();}
  if((e.metaKey||e.ctrlKey)&&e.key==='r'&&VIEWS[activeView]?.readOnly){e.preventDefault();activeView==='quickstart'?(VIEWS.quickstart.refresh&&VIEWS.quickstart.refresh()):primaryAction();}
});
